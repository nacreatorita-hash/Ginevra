height:100dvh;display:grid;place-items:center;padding:16px max(12px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));}.invite{position:relative;width:min(94vw,520px);height:min(95dvh,920px);aspect-ratio:9/16;max-width:calc(95dvh * 9 / 16);border-radius:34px;overflow:hidden;background:linear-gradient(180deg, rgba(255,255,255,.86), rgba(255,255,255,.68)), var(--panel);border:1px solid rgba(211,176,123,.35);box-shadow:var(--shadow);isolation:isolate;}.invite::before{content:"";position:absolute;inset:14px;border-radius:26px;border:1px solid rgba(211,176,123,.25);pointer-events:none;z-index:2}.invite::after{content:"";position:absolute;inset:24px 22px;border-radius:30px;border:1px solid rgba(195,127,138,.12);pointer-events:none;z-index:2}.ambient{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden}.spark{position:absolute;width:3px;height:3px;border-radius:50%;background:#ead7b8;box-shadow:0 0 8px rgba(234,215,184,.8);animation:twinkle 3s ease-in-out infinite}@keyframes twinkle{50%{opacity:.16;transform:scale(.45)}}.petal{position:absolute;top:-24px;width:10px;height:16px;border-radius:80% 0 80% 0;background:linear-gradient(135deg,#f9e2e6,#e6b2ba);opacity:.65;animation:fall linear forwards}@keyframes fall{to{transform:translate3d(var(--x),110vh,0) rotate(var(--r));opacity:0}}.slide-stage{position:absolute;inset:0;z-index:5}.slide{position:absolute;inset:0;padding:24px 18px 92px;display:flex;flex-direction:column;align-items:center;opacity:0;visibility:hidden;transform:translateX(10%) scale(.985);transition:opacity .65s ease, transform .82s cubic-bezier(.2,.72,.16,1), visibility .65s}.slide.active{opacity:1;visibility:visible;transform:translateX(0) scale(1)}.slide.prev{transform:translateX(-10%) scale(.985)}.artframe{position:relative;width:100%;height:100%;border-radius:24px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#fffdfc,#f7ece9);box-shadow:0 12px 36px rgba(132,93,91,.08)}.artframe img{width:95%;height:95%;object-fit:contain;display:block;transform:scale(1.001);animation:kenburns 16s ease-in-out infinite alternate;user-select:none;-webkit-user-drag:none}@keyframes kenburns{to{transform:scale(1.010) translateY(-.15%)}}.slide.has-map{gap:10px}.slide.has-map .artframe{height:calc(100% - 76px);flex:1 1 auto}.overlay-card{position:relative;width:100%;min-height:66px;display:none;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:20px;background:rgba(255,250,247,.92);backdrop-filter:blur(14px);border:1px solid rgba(211,176,123,.28);box-shadow:0 10px 24px rgba(140,104,101,.1);z-index:9;flex:0 0 auto}.slide.has-map .overlay-card{display:flex}.map-meta{display:flex;align-items:center;gap:12px;min-width:0}.pin{width:50px;height:50px;flex:none;border-radius:16px;background:#faeeeb;border:1px solid rgba(195,127,138,.14);display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.5)}.pin svg{width:28px;height:28px;display:block}.map-label{font-family:Manrope,sans-serif;font-size:10px;line-height:1;letter-spacing:.22em;text-transform:uppercase;color:#a68682;margin-bottom:4px}.map-title{font-size:19px;line-height:1.05;color:var(--ink);white-space:normal;font-weight:600}.map-sub{font-size:14px;line-height:1.15;color:var(--soft);margin-top:2px}.map-btn{flex:none;text-decoration:none;color:#fff;background:linear-gradient(135deg,var(--rose),var(--rose-dark));font-family:Manrope,sans-serif;font-size:13px;font-weight:600;letter-spacing:.01em;padding:12px 14px;border-radius:999px;box-shadow:0 10px 20px rgba(180,109,121,.22)}.page-ui{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;z-index:10;display:flex;align-items:center;gap:10px}.nav-btn{width:46px;height:46px;border-radius:50%;border:1px solid rgba(211,176,123,.42);background:rgba(255,252,250,.92);color:var(--rose-dark);font-size:24px;line-height:1;display:grid;place-items:center;box-shadow:0 10px 22px rgba(128,91,89,.12);cursor:pointer}.nav-btn:disabled{opacity:.35;cursor:default}.dots{display:flex;gap:7px;padding:0 5px}.dot{width:8px;height:8px;border-radius:999px;background:rgba(195,127,138,.28);transition:.3s}.dot.active{width:24px;background:rgba(195,127,138,.9)}.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:74px;z-index:10;font-family:Manrope,sans-serif;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#a58783;opacity:0;transition:.4s;white-space:nowrap}.hint.show{opacity:.8}.door-stage{position:absolute;inset:0;z-index:20;transform-style:preserve-3d;transition:opacity .55s ease 1s, visibility .55s ease 1s}.door-stage.hidden{opacity:0;visibility:hidden;pointer-events:none}.door{position:absolute;top:0;bottom:0;width:50.1%;background:linear-gradient(145deg,#fffdfb,#faefeb);border:1px solid rgba(211,176,123,.32);overflow:hidden;backface-visibility:hidden;transition:transform 1.3s cubic-bezier(.2,.75,.12,1)}.door::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 26% 18%, rgba(240,203,209,.38), transparent 28%), radial-gradient(circle at 74% 80%, rgba(246,225,228,.8), transparent 24%), radial-gradient(circle at 50% 50%, rgba(255,255,255,.95), transparent 46%)}.door.left{left:0;border-radius:34px 0 0 34px;transform-origin:left center}.door.right{right:0;border-radius:0 34px 34px 0;transform-origin:right center}.door-stage.open .door.left{transform:rotateY(-116deg)}.door-stage.open .door.right{transform:rotateY(116deg)}.seal-wrap{position:absolute;inset:0;display:grid;place-items:center;z-index:3;pointer-events:none;transition:opacity .35s ease, transform .45s ease}.door-stage.open .seal-wrap{opacity:0;transform:scale(.92)}.seal{width:178px;height:178px;border-radius:50%;background:rgba(255,252,250,.96);border:1px solid rgba(211,176,123,.72);box-shadow:0 18px 42px rgba(128,91,89,.12), inset 0 0 0 8px rgba(240,216,220,.24);display:grid;place-items:center;text-align:center;position:relative}.seal::before,.seal::after{content:"";position:absolute;border:1px solid rgba(195,127,138,.18);border-radius:inherit}.seal::before{inset:16px}.seal::after{inset:26px}.seal .mini{font-family:Manrope,sans-serif;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#9f7e7b}.seal .name{font-size:42px;line-height:.95;color:var(--rose);font-weight:600;margin:8px 0 4px}.seal .heart{color:var(--gold);font-size:18px}.open-btn{position:absolute;left:50%;transform:translateX(-50%);bottom:26px;z-index:25;border:1px solid rgba(211,176,123,.42);background:rgba(255,252,250,.95);color:var(--rose-dark);border-radius:999px;padding:14px 22px;font-family:Manrope,sans-serif;font-size:14px;font-weight:600;box-shadow:0 12px 30px rgba(128,91,89,.11);cursor:pointer;animation:pulse 1.7s ease-in-out infinite}.open-btn.hide{opacity:0;pointer-events:none;transition:.25s}@keyframes pulse{50%{transform:translateX(-50%) translateY(-4px)}}.balloon-float,.ribbon-float{position:absolute;pointer-events:none;z-index:8;opacity:.92;filter:drop-shadow(0 8px 18px rgba(175,125,132,.12))}.balloon-float{right:18px;bottom:104px;width:96px;animation:balloon 5.8s ease-in-out infinite}.ribbon-float{left:14px;top:28px;width:110px;animation:ribbon 5s ease-in-out infinite}@keyframes balloon{50%{transform:translateY(-10px) rotate(1deg)}}@keyframes ribbon{50%{transform:translateY(3px) rotate(-1deg)}}.balloon-float svg,.ribbon-float svg{display:block;width:100%;height:auto}.invite[data-page="1"] .ribbon-float,.invite[data-page="2"] .ribbon-float{opacity:.34}.invite[data-page="1"] .balloon-float,.invite[data-page="2"] .balloon-float{opacity:.38}@media (max-height:760px){.slide{padding:18px 15px 86px}.overlay-card{padding:9px 10px;min-height:62px}.map-title{font-size:17px}.map-sub{font-size:13px}.map-btn{padding:11px 13px;font-size:12px}.seal{width:158px;height:158px}.seal .name{font-size:36px}.ribbon-float{width:92px}.balloon-float{width:82px}}@media (max-width:390px){.slide{padding-inline:14px}.o .classList.remove('show'), 2600);setTimeout(() => doors.classList.add('hidden'), 900);}openBtn.addEventListener('click', openInvite);doors.addEventListener('click', openInvite);prev.addEventListener('click', () => go(index - 1));next.addEventListener('click', () => go(index + 1));document.addEventListener('keydown', e => {if (!opened && (e.key === 'Enter' || e.key === ' ')) openInvite();else if (opened && e.key === 'ArrowRight') go(index + 1);else if (opened && e.key === 'ArrowLeft') go(index - 1);});document.addEventListener('touchstart', e => { startX = e.changedTouches[0].clientX; startY = e.changedTouches[0].clientY; }, { passive: true });document.addEventListener('touchend', e => {if (!opened) return;const dx = e.changedTouches[0].clientX - startX;const dy = e.changedTouches[0].clientY - startY;if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.15) go(index + (dx < 0 ? 1 : -1));}, { passive: true });render();})();</script></body></html>
