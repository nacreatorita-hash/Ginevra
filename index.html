<body>

<script type="module">
import * as THREE from 'https://esm.sh/three@0.160.1';
import { OrbitControls } from 'https://esm.sh/three@0.160.1/examples/jsm/controls/OrbitControls.js';

const host=document.getElementById('scene');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xf8f2e8);
scene.fog=new THREE.FogExp2(0xf8f2e8,.032);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);camera.position.set(0,2.35,5.1);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xfff7ee,0x5f7d5b,2.5));const sun=new THREE.DirectionalLight(0xfff1cf,3.4);sun.position.set(-3,7,4);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-8;sun.shadow.camera.right=8;sun.shadow.camera.top=8;sun.shadow.camera.bottom=-8;scene.add(sun);

const ground=new THREE.Mesh(new THREE.CircleGeometry(13,96),new THREE.MeshStandardMaterial({color:0x9ebf83,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
function shrub(x,z,s=1){const g=new THREE.Group();const leafMat=new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(.31,.32,.28+Math.random()*.06),roughness:1});for(let i=0;i<9;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.28+Math.random()*.12,14,10),leafMat);const a=Math.random()*Math.PI*2,r=Math.random()*.42;m.position.set(Math.cos(a)*r,.18+Math.random()*.22,Math.sin(a)*r);m.scale.y=.75;m.castShadow=true;g.add(m)}const roseCols=[0xf5b9cb,0xef9fbc,0xffd4df,0xe889aa];for(let i=0;i<6;i++){const c=roseCols[i%roseCols.length];const r=new THREE.Mesh(new THREE.SphereGeometry(.075+Math.random()*.035,10,8),new THREE.MeshStandardMaterial({color:c,roughness:.8}));const a=Math.random()*Math.PI*2,rr=.12+Math.random()*.38;r.position.set(Math.cos(a)*rr,.35+Math.random()*.18,Math.sin(a)*rr);r.castShadow=true;g.add(r)}g.position.set(x,0,z);g.scale.setScalar(s);scene.add(g)}
for(let i=0;i<58;i++){const a=Math.random()*Math.PI*2,r=1.5+Math.random()*7.6;shrub(Math.cos(a)*r,Math.sin(a)*r,.55+Math.random()*.9)}

function makeCardTexture(){const c=document.createElement('canvas');c.width=1024;c.height=1434;const x=c.getContext('2d');x.fillStyle='#fff8f0';x.fillRect(0,0,c.width,c.height);const grad=x.createRadialGradient(512,130,30,512,300,700);grad.addColorStop(0,'rgba(248,200,208,.34)');grad.addColorStop(1,'rgba(255,248,240,0)');x.fillStyle=grad;x.fillRect(0,0,c.width,c.height);x.strokeStyle='rgba(201,168,106,.65)';x.lineWidth=3;x.strokeRect(50,50,924,1334);x.textAlign='center';x.fillStyle='#c9a86a';x.font='600 28px "Cormorant Garamond",serif';x.fillText('IL BATTESIMO DI',512,170);x.fillStyle='#5a3d4a';x.font='400 118px "Great Vibes",cursive';x.fillText('Ginevra',512,310);x.fillStyle='#4a3f35';x.font='600 40px "Cormorant Garamond",serif';x.fillText('SABATO 17 OTTOBRE 2026',512,430);x.fillStyle='#6b5a4a';x.font='400 36px "Cormorant Garamond",serif';x.fillText('ore 19:00',512,480);x.fillStyle='#c9a86a';x.font='400 26px "Cormorant Garamond",serif';x.fillText('Celebrazione presso',512,570);x.fillStyle='#4a3f35';x.font='600 40px "Cormorant Garamond",serif';x.fillText('Parrocchia Gesù Redentore',512,625);x.fillStyle='#6b5a4a';x.font='400 31px "Cormorant Garamond",serif';x.fillText("Sant'Antonio Abate",512,670);x.strokeStyle='rgba(201,168,106,.35)';x.beginPath();x.moveTo(420,745);x.lineTo(604,745);x.stroke();x.fillStyle='#c9a86a';x.font='400 27px "Cormorant Garamond",serif';x.fillText('A seguire, ore 20:30',512,815);x.fillStyle='#4a3f35';x.font='400 31px "Cormorant Garamond",serif';x.fillText('festeggiamo insieme presso',512,870);x.font='600 39px "Cormorant Garamond",serif';x.fillText('Villa Palmentiello',512,930);x.fillStyle='#7a6a5a';x.font='italic 400 31px "Cormorant Garamond",serif';x.fillText('Con gioia vi aspettiamo',512,1080);x.fillText('per condividere questo giorno speciale',512,1124);x.fillStyle='#c9a86a';x.font='400 42px serif';x.fillText('♡',512,1200);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=renderer.capabilities.getMaxAnisotropy();return t}
const card=new THREE.Mesh(new THREE.BoxGeometry(1.9,.08,2.66),[new THREE.MeshStandardMaterial({color:0xf5e8d8}),new THREE.MeshStandardMaterial({color:0xf5e8d8}),new THREE.MeshStandardMaterial({color:0xf5e8d8}),new THREE.MeshStandardMaterial({color:0xf5e8d8}),new THREE.MeshStandardMaterial({map:makeCardTexture(),roughness:.75}),new THREE.MeshStandardMaterial({color:0xfffaf3})]);card.rotation.x=-Math.PI/2;card.rotation.z=.04;card.position.set(0,.56,0);card.castShadow=true;card.receiveShadow=true;scene.add(card);const shadow=new THREE.Mesh(new THREE.PlaneGeometry(2.3,3.0),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.12}));shadow.rotation.x=-Math.PI/2;shadow.position.set(.12,.012,.18);scene.add(shadow);

function butterfly(color){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.CylinderGeometry(.013,.018,.12,8),new THREE.MeshStandardMaterial({color:0x5a4a3a}));body.rotation.z=Math.PI/2;g.add(body);const mat=new THREE.MeshStandardMaterial({color,side:THREE.DoubleSide,roughness:.65,transparent:true,opacity:.94});const geo=new THREE.CircleGeometry(.1,16);geo.scale(1.35,.85,1);const l=new THREE.Mesh(geo,mat),r=new THREE.Mesh(geo,mat.clone());l.position.set(-.055,.02,0);r.position.set(.055,.02,0);g.add(l,r);return{g,l,r}}
const butterflies=[];const bcols=[0xf8c8d0,0xffe066,0xa8d8ea,0xfbc2e0,0xc7f0bd,0xffd6a6];for(let i=0;i<12;i++){const b=butterfly(bcols[i%bcols.length]);b.a=Math.random()*Math.PI*2;b.rad=.65+Math.random()*1.8;b.h=.72+Math.random()*1.6;b.sp=.28+Math.random()*.55;b.ph=Math.random()*10;b.yoff=Math.random()*Math.PI*2;scene.add(b.g);butterflies.push(b)}
function balloon(x,y,z,scale=1,color=0xf8c2d4){const g=new THREE.Group();const env=new THREE.Mesh(new THREE.SphereGeometry(.38,28,20),new THREE.MeshStandardMaterial({color,roughness:.7}));env.scale.y=1.3;env.position.y=.6;env.castShadow=true;g.add(env);const band=new THREE.Mesh(new THREE.TorusGeometry(.25,.018,8,28),new THREE.MeshStandardMaterial({color:0xfff5ee,roughness:.7}));band.rotation.x=Math.PI/2;band.position.y=.6;g.add(band);const basket=new THREE.Mesh(new THREE.BoxGeometry(.17,.13,.17),new THREE.MeshStandardMaterial({color:0xb58964,roughness:1}));basket.position.y=-.18;basket.castShadow=true;g.add(basket);g.position.set(x,y,z);g.scale.setScalar(scale);g.userData={baseY:y,ph:Math.random()*6};scene.add(g);return g}
const balloons=[balloon(-3.8,4.7,-3,1.0,0xf6bfd1),balloon(4.5,5.2,-3.8,.9,0xaed6e8),balloon(1.3,4.1,5,.72,0xf8d3df)];
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.07;controls.target.set(0,.55,0);controls.minDistance=2.1;controls.maxDistance=7;controls.maxPolarAngle=Math.PI/2-.04;controls.autoRotate=true;controls.autoRotateSpeed=.55;let autorotate=true;const btn=document.getElementById('rotateBtn');btn.onclick=()=>{autorotate=!autorotate;controls.autoRotate=autorotate;btn.textContent=autorotate?'Pausa':'Ruota'};controls.addEventListener('start',()=>{autorotate=false;controls.autoRotate=false;btn.textContent='Ruota'});
const clock=new THREE.Clock();let last=performance.now();function animate(now=performance.now()){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.05);last=now;const t=clock.getElapsedTime();butterflies.forEach((b)=>{b.a+=dt*b.sp*.52;const x=Math.cos(b.a+b.ph)*b.rad;const z=Math.sin(b.a*.9+b.ph)*b.rad*.85;const y=b.h+Math.sin(t*1.3+b.yoff)*.28+Math.cos(b.a*2)*.12;b.g.position.set(x,y,z);const na=b.a+.05;b.g.lookAt(Math.cos(na+b.ph)*b.rad,y,Math.sin(na*.9+b.ph)*b.rad*.85);b.g.rotateY(Math.PI/2);const flap=Math.sin(t*12+b.yoff)*.85;b.l.rotation.y=flap;b.r.rotation.y=-flap;b.l.rotation.z=.2+flap*.15;b.r.rotation.z=-.2-flap*.15});balloons.forEach(g=>{const ph=g.userData.ph;g.position.y=g.userData.baseY+Math.sin(t*.35+ph)*.22;g.rotation.y=Math.sin(t*.15+ph)*.15;g.position.x+=Math.sin(t*.08+ph)*.0008});card.position.y=.56+Math.sin(t*.6)*.004;controls.update();renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
