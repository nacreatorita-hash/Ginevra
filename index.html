<!doctype html><html lang="it"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" /><title>Il Battesimo di Ginevra</title><meta name="theme-color" content="#fdf7f6" /><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{
--bg:#fcf4f2;
--panel:#fffaf8;
--ink:#6e5956;
--soft:#9d7b79;
--rose:#c37f8a;
--rose-dark:#b46d79;
--gold:#d3b07b;
--line:rgba(211,176,123,.35);
--shadow:0 18px 48px rgba(140,104,101,.14);
--radius:28px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{
font-family:"Cormorant Garamond",serif;
background:
radial-gradient(circle at 12% 10%, rgba(244,217,222,.85), transparent 20%),
radial-gradient(circle at 88% 14%, rgba(255,243,241,.95), transparent 22%),
radial-gradient(circle at 50% 100%, rgba(243,221,223,.75), transparent 28%),
linear-gradient(180deg,#fffefd 0%,#fbf2ef 100%);
color:var(--ink);
}
body::before{
content:"";
position:fixed; inset:0; pointer-events:none;
background-image:
radial-gradient(circle, rgba(211,176,123,.45) 0 1px, transparent 1.4px),
radial-gradient(circle, rgba(195,127,138,.14) 0 1px, transparent 1.4px);
background-size:74px 74px, 110px 110px;
background-position:0 0, 24px 26px;
opacity:.36;
}
.cloud{position:fixed;opacity:.55;pointer-events:none;animation:floatCloud 18s ease-in-out infinite alternate}
.cloud svg{display:block;width:100%;height:auto}
.cloud.one{width:min(45vw,220px);left:-6vw;top:8vh}
.cloud.two{width:min(50vw,280px);right:-8vw;bottom:18vh;animation-duration:24s;animation-delay:-5s}
.cloud.three{width:min(24vw,140px);left:42vw;top:38vh;opacity:.25;animation-duration:20s;animation-delay:-2s}
@keyframes floatCloud{to{transform:translate3d(24px,-10px,0) scale(1.02)}}
.app{position:relative;height:100dvh;display:grid;place-items:center;padding:16px max(12px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));}
.invite{
position:relative;
width:min(94vw,520px);
height:min(95dvh,920px);
aspect-ratio:9/16;
max-width:calc(95dvh * 9 / 16);
border-radius:34px;
overflow:hidden;
background:linear-gradient(180deg, rgba(255,255,255,.86), rgba(255,255,255,.68)), var(--panel);
border:1px solid rgba(211,176,123,.35);
box-shadow:var(--shadow);
isolation:isolate;
}
.invite::before{content:"";position:absolute;inset:14px;border-radius:26px;border:1px solid rgba(211,176,123,.25);pointer-events:none;z-index:2}
.invite::after{content:"";position:absolute;inset:24px 22px;border-radius:30px;border:1px solid rgba(195,127,138,.12);pointer-events:none;z-index:2}
.ambient{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.spark{position:absolute;width:3px;height:3px;border-radius:50%;background:#ead7b8;box-shadow:0 0 8px rgba(234,215,184,.8);animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.16;transform:scale(.45)}}
.petal{position:absolute;top:-24px;width:10px;height:16px;border-radius:80% 0 80% 0;background:linear-gradient(135deg,#f9e2e6,#e6b2ba);opacity:.65;animation:fall linear forwards}
@keyframes fall{to{transform:translate3d(var(--x),110vh,0) rotate(var(--r));opacity:0}}
.slide-stage{position:absolute;inset:0;z-index:5}
.slide{position:absolute;inset:0;padding:28px 20px 96px;display:flex;flex-direction:column;align-items:center;opacity:0;visibility:hidden;transform:translateX(10%) scale(.985);transition:opacity .65s ease, transform .82s cubic-bezier(.2,.72,.16,1), visibility .65s}
.slide.active{opacity:1;visibility:visible;transform:translateX(0) scale(1)}
.slide.prev{transform:translateX(-10%) scale(.985)}
.artframe{
position:relative;
width:100%;
height:100%;
border-radius:26px;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(180deg,#fffdfc,#f7ece9);
box-shadow:0 12px 36px rgba(132,93,91,.08);
}
.artframe img{
width:100%;height:100%;object-fit:contain;display:block;
transform:scale(1.004);
animation:kenburns 16s ease-in-out infinite alternate;
user-select:none;-webkit-user-drag:none;
}
@keyframes kenburns{to{transform:scale(1.022) translateY(-.35%)}}
.slide.has-map{gap:10px}
.slide.has-map .artframe{height:calc(100% - 78px);flex:1 1 auto}
.overlay-card{
position:relative;left:auto;right:auto;bottom:auto;width:100%;min-height:68px;
display:none;align-items:center;justify-content:space-between;gap:12px;
padding:10px 12px;border-radius:20px;
background:rgba(255,250,247,.92);
backdrop-filter:blur(14px);
border:1px solid rgba(211,176,123,.28);
box-shadow:0 10px 24px rgba(140,104,101,.1);
z-index:9;flex:0 0 auto;
}
.slide.has-map .overlay-card{display:flex}
.map-meta{display:flex;align-items:center;gap:12px;min-width:0}
.pin{
width:52px;height:52px;flex:none;border-radius:16px;background:#faeeeb;
border:1px solid rgba(195,127,138,.14);display:grid;place-items:center;
box-shadow:inset 0 0 0 1px rgba(255,255,255,.5);
}
.pin svg{width:28px;height:28px;display:block}
.map-label{font-family:Inter,sans-serif;font-size:10px;line-height:1;letter-spacing:.22em;text-transform:uppercase;color:#a68682;margin-bottom:4px}
.map-title{font-size:22px;line-height:1.05;color:var(--ink);white-space:normal}
.map-sub{font-size:15px;line-height:1.15;color:var(--soft);margin-top:2px}
.map-btn{
flex:none;text-decoration:none;color:#fff;background:linear-gradient(135deg,var(--rose),var(--rose-dark));
font-family:Inter,sans-serif;font-size:14px;font-weight:600;letter-spacing:.01em;
padding:13px 16px;border-radius:999px;box-shadow:0 10px 20px rgba(180,109,121,.22)
}
.page-ui{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;z-index:10;display:flex;align-items:center;gap:10px}
.nav-btn{
width:46px;height:46px;border-radius:50%;border:1px solid rgba(211,176,123,.42);background:rgba(255,252,250,.92);
color:var(--rose-dark);font-size:24px;line-height:1;display:grid;place-items:center;box-shadow:0 10px 22px rgba(128,91,89,.12);cursor:pointer
}
.nav-btn:disabled{opacity:.35;cursor:default}
.dots{display:flex;gap:7px;padding:0 5px}
.dot{width:8px;height:8px;border-radius:999px;background:rgba(195,127,138,.28);transition:.3s}
.dot.active{width:24px;background:rgba(195,127,138,.9)}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:74px;z-index:10;font-family:Inter,sans-serif;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#a58783;opacity:0;transition:.4s;white-space:nowrap}.hint.show{opacity:.8}
.door-stage{position:absolute;inset:0;z-index:20;transform-style:preserve-3d;transition:opacity .55s ease 1s, visibility .55s ease 1s}
.door-stage.hidden{opacity:0;visibility:hidden;pointer-events:none}
.door{position:absolute;top:0;bottom:0;width:50.1%;background:linear-gradient(145deg,#fffdfb,#faefeb);border:1px solid rgba(211,176,123,.32);overflow:hidden;backface-visibility:hidden;transition:transform 1.3s cubic-bezier(.2,.75,.12,1)}
.door::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 26% 18%, rgba(240,203,209,.38), transparent 28%), radial-gradient(circle at 74% 80%, rgba(246,225,228,.8), transparent 24%), radial-gradient(circle at 50% 50%, rgba(255,255,255,.95), transparent 46%)}
.door.left{left:0;border-radius:34px 0 0 34px;transform-origin:left center}
.door.right{right:0;border-radius:0 34px 34px 0;transform-origin:right center}
.door-stage.open .door.left{transform:rotateY(-116deg)}
.door-stage.open .door.right{transform:rotateY(116deg)}
.seal-wrap{position:absolute;inset:0;display:grid;place-items:center;z-index:3;pointer-events:none;transition:opacity .35s ease, transform .45s ease}
.door-stage.open .seal-wrap{opacity:0;transform:scale(.92)}
.seal{
width:180px;height:180px;border-radius:50%;background:rgba(255,252,250,.96);
border:1px solid rgba(211,176,123,.72);box-shadow:0 18px 42px rgba(128,91,89,.12), inset 0 0 0 8px rgba(240,216,220,.24);
display:grid;place-items:center;text-align:center;position:relative
}
.seal::before,.seal::after{content:"";position:absolute;border:1px solid rgba(195,127,138,.18);border-radius:inherit}.seal::before{inset:16px}.seal::after{inset:26px}
.seal .mini{font-family:Inter,sans-serif;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#9f7e7b}
.seal .name{font-size:44px;line-height:.95;color:var(--rose);font-weight:600;margin:8px 0 4px}
.seal .heart{color:var(--gold);font-size:18px}
.open-btn{
position:absolute;left:50%;transform:translateX(-50%);bottom:26px;z-index:25;
border:1px solid rgba(211,176,123,.42);background:rgba(255,252,250,.95);color:var(--rose-dark);
border-radius:999px;padding:14px 22px;font-family:Inter,sans-serif;font-size:15px;font-weight:600;
box-shadow:0 12px 30px rgba(128,91,89,.11);cursor:pointer;animation:pulse 1.7s ease-in-out infinite
}
.open-btn.hide{opacity:0;pointer-events:none;transition:.25s}
.open-btn:disabled{opacity:.76;cursor:wait;animation:none}
@keyframes pulse{50%{transform:translateX(-50%) translateY(-4px)}}
.balloon-float,.ribbon-float{position:absolute;pointer-events:none;z-index:8;opacity:.92;filter:drop-shadow(0 8px 18px rgba(175,125,132,.12))}
.balloon-float{right:18px;bottom:104px;width:96px;animation:balloon 5.8s ease-in-out infinite}
.ribbon-float{left:14px;top:28px;width:110px;animation:ribbon 5s ease-in-out infinite}
@keyframes balloon{50%{transform:translateY(-10px) rotate(1deg)}}
@keyframes ribbon{50%{transform:translateY(3px) rotate(-1deg)}}
.balloon-float svg,.ribbon-float svg{display:block;width:100%;height:auto}
.invite[data-page="1"] .ribbon-float,.invite[data-page="2"] .ribbon-float{opacity:.38}
.invite[data-page="1"] .balloon-float,.invite[data-page="2"] .balloon-float{opacity:.42}
@media (max-height:760px){
.slide{padding:20px 16px 88px}
.overlay-card{padding:9px 10px;min-height:64px}
.map-title{font-size:19px}
.map-sub{font-size:14px}
.map-btn{padding:11px 14px;font-size:13px}
.seal{width:160px;height:160px}.seal .name{font-size:38px}
.ribbon-float{width:96px}.balloon-float{width:84px}
}
@media (max-width:390px){
.overlay-card{gap:10px}
.pin{width:48px;height:48px}
.map-title{font-size:17px}
.map-sub{font-size:13px}
.map-btn{padding:10px 12px;font-size:12px}
}
@media (prefers-reduced-motion: reduce){
*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
}
</style></head><body><div class="cloud one"><svg viewBox="0 0 260 110" aria-hidden="true"><path d="M36 82c-20 0-34-11-34-26 0-15 14-27 31-27 6 0 12 2 17 5C58 13 76 0 98 0c24 0 44 15 50 35 6-5 15-8 24-8 20 0 36 13 38 30 4-2 10-3 15-3 19 0 35 11 35 25 0 16-17 28-38 28H36z" fill="#fff"/></svg></div><div class="cloud two"><svg viewBox="0 0 260 110" aria-hidden="true"><path d="M36 82c-20 0-34-11-34-26 0-15 14-27 31-27 6 0 12 2 17 5C58 13 76 0 98 0c24 0 44 15 50 35 6-5 15-8 24-8 20 0 36 13 38 30 4-2 10-3 15-3 19 0 35 11 35 25 0 16-17 28-38 28H36z" fill="#fff8f5"/></svg></div><div class="cloud three"><svg viewBox="0 0 260 110" aria-hidden="true"><path d="M36 82c-20 0-34-11-34-26 0-15 14-27 31-27 6 0 12 2 17 5C58 13 76 0 98 0c24 0 44 15 50 35 6-5 15-8 24-8 20 0 36 13 38 30 4-2 10-3 15-3 19 0 35 11 35 25 0 16-17 28-38 28H36z" fill="#fff"/></svg></div><div class="app"><main class="invite" aria-label="Invito interattivo al Battesimo di Ginevra"><div class="ambient" id="ambient"></div><div class="ribbon-float" aria-hidden="true"><svg viewBox="0 0 190 160"><path d="M68 59C46 34 19 33 5 44c13 10 20 22 20 38 13-6 29-10 47-6" fill="#f3c7ce"/><path d="M75 64c18-28 42-40 70-36-11 13-15 27-13 41-17-2-35 2-53 10" fill="#f3c7ce"/><path d="M70 55c-14 10-14 27-4 39 11 12 30 9 37-5 6-12 2-26-9-32-7-4-15-5-24-2z" fill="#d98d99"/><path d="M70 92c-10 18-19 38-20 58 12-6 23-11 33-21 3 9 9 18 18 25 6-27 2-47-8-62" fill="#f3c7ce"/></svg></div><div class="balloon-float" aria-hidden="true"><svg viewBox="0 0 150 215"><path d="M75 10c36 0 55 26 55 58 0 36-26 68-45 88H65C46 136 20 104 20 68 20 36 39 10 75 10z" fill="#f5d6dc" stroke="#d0aa72" stroke-width="2"/><path d="M75 12c-13 22-19 47-18 72 2 25 8 49 18 72 10-23 16-47 18-72 1-25-5-50-18-72z" fill="#fff8f6" opacity=".75"/><path d="M42 27c13 12 22 33 24 58 1 27-5 50-16 71M108 27c-13 12-22 33-24 58-1 27 5 50 16 71" fill="none" stroke="#caa66d" stroke-width="2"/><path d="M49 70c17 8 35 8 52 0M56 114c13 6 26 6 39 0" fill="none" stroke="#fff" stroke-width="5" opacity=".68"/><path d="M64 156l-7 31M86 156l7 31" stroke="#b08962" stroke-width="2"/><path d="M52 183h46l-6 19H58z" fill="#cea979" stroke="#9f7a59" stroke-width="2"/><path d="M68 178c-14-9-22-13-31-8M82 178c14-9 22-13 31-8" fill="none" stroke="#da95a0" stroke-width="4" stroke-linecap="round"/></svg></div><section class="slide-stage" id="slides"><article class="slide active" data-index="0"><div class="artframe"><img data-page="1" alt="Prima pagina dell'invito al Battesimo di Ginevra" /></div></article><article class="slide has-map" data-index="1"><div class="artframe"><img data-page="2" alt="Pagina della celebrazione del Battesimo" /></div><div class="overlay-card"><div class="map-meta"><div class="pin" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2.5c-3.7 0-6.7 2.9-6.7 6.5 0 5.1 6.7 12.4 6.7 12.4S18.7 14 18.7 9c0-3.6-3-6.5-6.7-6.5Z" fill="#c37f8a"/><circle cx="12" cy="9" r="2.6" fill="#fff"/></svg></div><div><div class="map-label">Posizione</div><div class="map-title">Parrocchia Gesù Redentore</div><div class="map-sub">Sant’Antonio Abate</div></div></div><a class="map-btn" href="https://maps.app.goo.gl/4Z26YoyzbJPuBVn4A?g_st=ic" target="_blank" rel="noopener">Apri Maps</a></div></article><article class="slide has-map" data-index="2"><div class="artframe"><img data-page="3" alt="Pagina del ricevimento a Villa Palmentiello" /></div><div class="overlay-card"><div class="map-meta"><div class="pin" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2.5c-3.7 0-6.7 2.9-6.7 6.5 0 5.1 6.7 12.4 6.7 12.4S18.7 14 18.7 9c0-3.6-3-6.5-6.7-6.5Z" fill="#c37f8a"/><circle cx="12" cy="9" r="2.6" fill="#fff"/></svg></div><div><div class="map-label">Ricevimento</div><div class="map-title">Villa Palmentiello</div><div class="map-sub">Casola di Napoli</div></div></div><a class="map-btn" href="https://maps.app.goo.gl/sZAAL1ZX2st9a4f99?g_st=ic" target="_blank" rel="noopener">Apri Maps</a></div></article></section><div class="hint" id="hint">Scorri per continuare</div><div class="page-ui"><button class="nav-btn" id="prev" aria-label="Pagina precedente">‹</button><div class="dots"><span class="dot active"></span><span class="dot"></span><span class="dot"></span></div><button class="nav-btn" id="next" aria-label="Pagina successiva">›</button></div><div class="door-stage" id="doors" aria-hidden="true"><div class="door left"></div><div class="door right"></div><div class="seal-wrap"><div class="seal"><div class="heart">♡</div><div class="mini">Il Battesimo di</div><div class="name">Ginevra</div><div class="mini">17 Ottobre</div></div></div></div><button class="open-btn" id="openBtn" type="button" disabled>Prepariamo l’invito…</button></main></div><script>
(() => {
const slides = [...document.querySelectorAll('.slide')];
const dots = [...document.querySelectorAll('.dot')];
const prev = document.getElementById('prev');
const next = document.getElementById('next');
const hint = document.getElementById('hint');
const doors = document.getElementById('doors');
const openBtn = document.getElementById('openBtn');
const ambient = document.getElementById('ambient');
let index = 0;
let opened = false;
let startX = 0;
let startY = 0;
async function loadAvif(page, count) {
const parts = await Promise.all(Array.from({length:count}, (_,i) => {
const n = String(i + 1).padStart(2, '0');
return fetch(`assets/p${page}-${n}.txt?v=editorial5`).then(r => {
if (!r.ok) throw new Error(`Impossibile caricare p${page}-${n}`);
return r.text();
});
}));
return `data:image/avif;base64,${parts.join('').replace(/\s/g,'')}`;
}
async function preloadEditorialPages() {
const imgs = [...document.querySelectorAll('img[data-page]')];
try {
const sources = await Promise.all([loadAvif(1,7), loadAvif(2,7), loadAvif(3,4)]);
sources.forEach((src,i) => imgs[i].src = src);
await Promise.all(imgs.map(img => img.decode ? img.decode().catch(() => {}) : Promise.resolve()));
} catch (err) {
console.error(err);
['pagina-1.webp','pagina-2.webp','pagina-3.webp'].forEach((src,i) => imgs[i].src = src);
}
openBtn.disabled = false;
openBtn.textContent = 'Tocca per aprire l’invito';
}
for (let i = 0; i < 26; i++) {
const s = document.createElement('i');
s.className = 'spark';
s.style.left = (3 + Math.random() * 94) + '%';
s.style.top = (3 + Math.random() * 94) + '%';
s.style.animationDelay = (-Math.random() * 3) + 's';
s.style.animationDuration = (2.2 + Math.random() * 2.2) + 's';
ambient.appendChild(s);
}
function petals(count = 8) {
for (let i = 0; i < count; i++) {
const p = document.createElement('i');
p.className = 'petal';
p.style.left = (Math.random() * 100) + '%';
p.style.setProperty('--x', (Math.random() * 170 - 85) + 'px');
p.style.setProperty('--r', (Math.random() * 640 - 320) + 'deg');
p.style.animationDuration = (4.8 + Math.random() * 2.6) + 's';
ambient.appendChild(p);
setTimeout(() => p.remove(), 8000);
}
}
function render() {
slides.forEach((slide, i) => {
slide.classList.remove('active', 'prev');
if (i === index) slide.classList.add('active');
if (i < index) slide.classList.add('prev');
});
dots.forEach((dot, i) => dot.classList.toggle('active', i === index));
prev.disabled = index === 0;
next.disabled = index === slides.length - 1;
document.querySelector('.invite').dataset.page = index;
}
function go(to) {
to = Math.max(0, Math.min(slides.length - 1, to));
if (to === index) return;
index = to;
render();
petals(index === 2 ? 10 : 6);
}
function openInvite() {
if (opened || openBtn.disabled) return;
opened = true;
doors.classList.add('open');
openBtn.classList.add('hide');
petals(14);
hint.classList.add('show');
setTimeout(() => hint.classList.remove('show'), 2600);
setTimeout(() => doors.classList.add('hidden'), 900);
}
openBtn.addEventListener('click', openInvite);
doors.addEventListener('click', openInvite);
prev.addEventListener('click', () => go(index - 1));
next.addEventListener('click', () => go(index + 1));
document.addEventListener('keydown', (e) => {
if (!opened && (e.key === 'Enter' || e.key === ' ')) openInvite();
else if (opened && e.key === 'ArrowRight') go(index + 1);
else if (opened && e.key === 'ArrowLeft') go(index - 1);
});
document.addEventListener('touchstart', (e) => {
startX = e.changedTouches[0].clientX;
startY = e.changedTouches[0].clientY;
}, { passive: true });
document.addEventListener('touchend', (e) => {
if (!opened) return;
const dx = e.changedTouches[0].clientX - startX;
const dy = e.changedTouches[0].clientY - startY;
if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.15) {
go(index + (dx < 0 ? 1 : -1));
}
}, { passive: true });
render();
preloadEditorialPages();
})();
</script></body></html>
