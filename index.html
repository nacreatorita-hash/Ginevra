<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Battesimo di Ginevra</title>
<style>
html,body{margin:0;height:100%;background:#f8efec;font-family:Georgia,serif;overflow:hidden}
*{box-sizing:border-box}
.wrap{height:100%;display:flex;align-items:center;justify-content:center;padding:10px}
.book{position:relative;width:min(94vw,430px);aspect-ratio:9/16;max-height:96vh;perspective:1400px}
.page{position:absolute;inset:0;border-radius:20px;overflow:hidden;background:white;box-shadow:0 18px 50px rgba(110,70,70,.2);opacity:0;transform:translateX(10%) scale(.985);transition:.7s ease;pointer-events:none}
.page.active{opacity:1;transform:none;pointer-events:auto;z-index:3}
.page.left{opacity:0;transform:translateX(-15%) rotateY(12deg);z-index:2}
.page img{width:100%;height:100%;object-fit:cover;display:block}
.cover{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;cursor:pointer}
.panel{position:absolute;top:0;bottom:0;width:50.2%;background:linear-gradient(#fffaf8,#f7e8e6);border:1px solid rgba(194,155,102,.4);transition:1.05s cubic-bezier(.2,.7,.2,1)}
.panel.l{left:0;transform-origin:left;border-radius:20px 0 0 20px}
.panel.r{right:0;transform-origin:right;border-radius:0 20px 20px 0}
.cover.open .panel.l{transform:rotateY(-105deg)}
.cover.open .panel.r{transform:rotateY(105deg)}
.seal{z-index:12;width:145px;height:145px;border-radius:50%;background:#fffaf8;border:1px solid #d6b27a;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#bd7a82;box-shadow:0 12px 30px rgba(120,70,70,.16);transition:.35s;text-align:center}
.seal b{font-size:23px;font-weight:normal}
.seal small{margin-top:7px;letter-spacing:.12em;color:#94726f;text-transform:uppercase}
.cover.open .seal{opacity:0;transform:scale(.9)}
.nav{position:absolute;z-index:20;left:50%;bottom:13px;transform:translateX(-50%);display:none;gap:10px;align-items:center}
.nav.show{display:flex}
button{width:42px;height:42px;border-radius:50%;border:1px solid #d3ab70;background:rgba(255,250,248,.94);font-size:23px;color:#bd7a82}
button:disabled{opacity:.3}
.dots{display:flex;gap:6px}
.dot{width:7px;height:7px;border-radius:99px;background:#e7c3c6;transition:.25s}
.dot.on{width:20px;background:#bd7a82}
.tip{position:absolute;z-index:25;left:50%;bottom:28px;transform:translateX(-50%);padding:10px 15px;border-radius:30px;background:#fffaf8;border:1px solid #d9b880;color:#a66b72;font-size:13px;box-shadow:0 8px 20px rgba(100,60,60,.12)}
.tip.hide{display:none}
.petal{position:fixed;top:-20px;width:9px;height:14px;background:#e8b9bf;border-radius:80% 0 80% 0;opacity:.55;pointer-events:none;animation:fall 5s linear forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(430deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="book" id="book">
    <div class="page active"><img src="pagina-1.webp" alt="Invito Battesimo Ginevra"></div>
    <div class="page"><img src="pagina-2.webp" alt="Celebrazione del Battesimo"></div>
    <div class="page"><img src="pagina-3.webp" alt="Ricevimento"></div>
    <div class="cover" id="cover">
      <div class="panel l"></div><div class="panel r"></div>
      <div class="seal"><span>♡</span><b>Ginevra</b><small>Il suo Battesimo</small></div>
    </div>
    <div class="tip" id="tip">Tocca per aprire</div>
    <div class="nav" id="nav">
      <button id="prev" aria-label="Indietro">‹</button>
      <div class="dots"><span class="dot on"></span><span class="dot"></span><span class="dot"></span></div>
      <button id="next" aria-label="Avanti">›</button>
    </div>
  </div>
</div>
<script>
(function(){
var pages=[].slice.call(document.querySelectorAll('.page'));
var dots=[].slice.call(document.querySelectorAll('.dot'));
var cover=document.getElementById('cover'),tip=document.getElementById('tip'),nav=document.getElementById('nav');
var prev=document.getElementById('prev'),next=document.getElementById('next');
var i=0,opened=false,sx=0;
function petals(n){for(var k=0;k<n;k++){var p=document.createElement('i');p.className='petal';p.style.left=(5+Math.random()*90)+'vw';p.style.setProperty('--dx',(Math.random()*130-65)+'px');p.style.animationDuration=(4+Math.random()*2.5)+'s';document.body.appendChild(p);setTimeout(function(x){return function(){x.remove()}}(p),7000);}}
function update(){pages.forEach(function(p,x){p.className='page'+(x===i?' active':x<i?' left':'')});dots.forEach(function(d,x){d.className='dot'+(x===i?' on':'')});prev.disabled=i===0; next.disabled=i===pages.length-1;}
function go(n){if(n<0||n>=pages.length||n===i)return;i=n;update();petals(6);}
function openIt(){if(opened)return;opened=true;cover.classList.add('open');tip.classList.add('hide');petals(14);setTimeout(function(){cover.style.display='none';nav.classList.add('show')},900);}
cover.onclick=openIt; tip.onclick=openIt; prev.onclick=function(){go(i-1)}; next.onclick=function(){go(i+1)};
document.addEventListener('touchstart',function(e){sx=e.changedTouches[0].clientX},{passive:true});
document.addEventListener('touchend',function(e){if(!opened)return;var dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>45)go(i+(dx<0?1:-1));},{passive:true});
document.addEventListener('keydown',function(e){if(!opened&&(e.key==='Enter'||e.key===' '))openIt();else if(opened&&e.key==='ArrowRight')go(i+1);else if(opened&&e.key==='ArrowLeft')go(i-1);});
update();
})();
</script>
</body>
</html>
