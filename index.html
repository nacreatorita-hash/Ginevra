<!doctype html><html lang="it"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><title>Il Battesimo di Ginevra</title><meta name="theme-color" content="#fdf7f6"/><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet"><style>:root{--panel:#fffaf8;--ink:#6f5c59;--soft:#967977;--rose:#c37f8a;--rose-dark:#ac6572;--gold:#d3b07b;--shadow:0 18px 48px rgba(140,104,101,.14)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0;overflow:hidden}body{font-family:"Cormorant Garamond",serif;background:radial-gradient(circle at 12% 10%,rgba(244,217,222,.85),transparent 20%),radial-gradient(circle at 88% 14%,rgba(255,243,241,.95),transparent 22%),linear-gradient(180deg,#fffefd,#fbf2ef);color:var(--ink)}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.3;background-image:radial-gradient(circle,rgba(211,176,123,.4) 0 1px,transparent 1.4px);background-size:78px 78px}.app{position:relative;height:100dvh;display:grid;place-items:center;padding:14px max(10px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}.invite{position:relative;width:min(94vw,520px);height:min(95dvh,920px);aspect-ratio:9/16;max-width:calc(95dvh * 9 / 16);border-radius:32px;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.72)),var(--panel);border:1px solid rgba(211,176,123,.34);box-shadow:var(--shadow);isolation:isolate}.invite:before{content:"";position:absolute;inset:14px;border-radius:24px;border:1px solid rgba(211,176,123,.24);pointer-events:none;z-index:2}.ambient{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden}.spark{position:absolute;width:3px;height:3px;border-radius:50%;background:#ead7b8;animation:twinkle 3s ease-in-out infinite}@keyframes twinkle{50%{opacity:.15;transform:scale(.5)}}.petal{position:absolute;top:-20px;width:9px;height:14px;border-radius:80% 0 80% 0;background:linear-gradient(135deg,#f9e2e6,#e6b2ba);opacity:.58;animation:fall linear forwards}@keyframes fall{to{transform:translate3d(var(--x),110vh,0) rotate(var(--r));opacity:0}}.slide-stage{position:absolute;inset:0;z-index:5}.slide{position:absolute;inset:0;padding:24px 18px 92px;display:flex;flex-direction:column;align-items:center;opacity:0;visibility:hidden;transform:translateX(8%) scale(.988);transition:opacity .6s ease,transform .8s cubic-bezier(.2,.72,.16,1),visibility .6s}.slide.active{opacity:1;visibility:visible;transform:none}.slide.prev{transform:translateX(-8%) scale(.988)}.artframe{position:relative;width:100%;height:100%;border-radius:22px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#fffdfc;box-shadow:0 10px 30px rgba(132,93,91,.07)}.artframe img{width:93%;height:93%;object-fit:contain;display:block;transform:scale(1.001);animation:ken 18s ease-in-out infinite alternate;user-select:none;-webkit-user-drag:none}@keyframes ken{to{transform:scale(1.008) translateY(-.1%)}}.slide.has-map{gap:10px}.slide.has-map .artframe{height:calc(100% - 72px);flex:1 1 auto}.overlay-card{width:100%;min-height:64px;display:none;align-items:center;justify-content:space-between;gap:10px;padding:9px 11px;border-radius:18px;background:rgba(255,250,247,.94);backdrop-filter:blur(14px);border:1px solid rgba(211,176,123,.28);box-shadow:0 8px 20px rgba(140,104,101,.09);z-index:9;flex:0 0 auto}.slide.has-map .overlay-card{display:flex}.map-meta{display:flex;align-items:center;gap:10px;min-width:0}.pin{width:46px;height:46px;flex:none;border-radius:14px;background:#faeeeb;display:grid;place-items:center}.pin svg{width:25px;height:25px}.map-label{font-family:Manrope,sans-serif;font-size:9px;line-height:1;letter-spacing:.18em;text-transform:uppercase;color:#a68682;margin-bottom:4px}.map-title{font-size:17px;line-height:1.05;color:var(--ink);font-weight:600}.map-sub{font-size:13px;line-height:1.15;color:var(--soft);margin-top:2px}.map-btn{flex:none;text-decoration:none;color:#fff;background:linear-gradient(135deg,var(--rose),var(--rose-dark));font-family:Manrope,sans-serif;font-size:12px;font-weight:600;padding:10px 12px;border-radius:999px;box-shadow:0 8px 16px rgba(180,109,121,.2)}.page-ui{position:absolute;left:50%;transform:translateX(-50%);bottom:17px;z-index:10;display:flex;align-items:center;gap:9px}.nav-btn{width:44px;height:44px;border-radius:50%;border:1px solid rgba(211,176,123,.4);background:rgba(255,252,250,.94);color:var(--rose-dark);font-size:23px;display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 18px rgba(128,91,89,.1)}.nav-btn:disabled{opacity:.32}.dots{display:flex;gap:6px}.dot{width:7px;height:7px;border-radius:999px;background:rgba(195,127,138,.26);transition:.3s}.dot.active{width:22px;background:rgba(195,127,138,.88)}.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:70px;z-index:10;font-family:Manrope,sans-serif;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#a58783;opacity:0;transition:.4s;white-space:nowrap}.hint.show{opacity:.75}.door-stage{position:absolute;inset:0;z-index:20;transform-style:preserve-3d;transition:opacity .55s ease 1s,visibility .55s ease 1s}.door-stage.hidden{opacity:0;visibility:hidden;pointer-events:none}.door{position:absolute;top:0;bottom:0;width:50.1%;background:linear-gradient(145deg,#fffdfb,#faefeb);border:1px solid rgba(211,176,123,.3);backface-visibility:hidden;transition:transform 1.25s cubic-bezier(.2,.75,.12,1)}.door.left{left:0;border-radius:32px 0 0 32px;transform-origin:left center}.door.right{right:0;border-radius:0 32px 32px 0;transform-origin:right center}.door-stage.open .door.left{transform:rotateY(-116deg)}.door-stage.open .door.right{transform:rotateY(116deg)}.seal-wrap{position:absolute;inset:0;display:grid;place-items:center;z-index:3;pointer-events:none;transition:opacity .35s ease,transform .45s ease}.door-stage.open .seal-wrap{opacity:0;transform:scale(.94)}.seal{width:170px;height:170px;border-radius:50%;background:rgba(255,252,250,.97);border:1px solid rgba(211,176,123,.7);box-shadow:0 16px 36px rgba(128,91,89,.12),inset 0 0 0 7px rgba(240,216,220,.22);display:grid;place-items:center;text-align:center;position:relative}.seal:before,.seal:after{content:"";position:absolute;border:1px solid rgba(195,127,138,.17);border-radius:inherit}.seal:before{inset:15px}.seal:after{inset:25px}.seal .mini{font-family:Manrope,sans-serif;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#9f7e7b}.seal .name{font-family:"Cormorant Garamond",serif;font-size:39px;line-height:.96;color:var(--rose);font-weight:600;margin:7px 0 3px}.seal .heart{color:var(--gold);font-size:17px}.open-btn{position:absolute;left:50%;transform:translateX(-50%);bottom:24px;z-index:25;border:1px solid rgba(211,176,123,.4);background:rgba(255,252,250,.96);color:var(--rose-dark);border-radius:999px;padding:13px 20px;font-family:Manrope,sans-serif;font-size:13px;font-weight:600;box-shadow:0 10px 24px rgba(128,91,89,.1);cursor:pointer;animation:pulse 1.8s ease-in-out infinite}.open-btn.hide{opacity:0;pointer-events:none}@keyframes pulse{50%{transform:translateX(-50%) translateY(-3px)}}@media(max-height:760px){.slide{padding:18px 14px 84px}.map-title{font-size:15px}.map-sub{font-size:12px}.map-btn{font-size:11px;padding:9px 11px}.seal{width:154px;height:154px}.seal .name{font-size:34px}}@media(max-width:390px){.slide{padding-inline:13px}.pin{width:43px;height:43px}.map-title{font-size:15px}.map-sub{font-size:12px}.map-btn{font-size:11px;padding:9px 10px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition-duration:.01ms!important}}</style></head><body><div class="app"><main class="invite" id="invite" data-page="0" aria-label="Invito interattivo al Battesimo di Ginevra"><div class="ambient" id="ambient"></div><section class="slide-stage"><article class="slide active" data-index="0"><div class="artframe"><img src="pagina-1.webp" alt="Prima pagina dell'invito al Battesimo di Ginevra"></div></article><article class="slide has-map" data-index="1"><div class="artframe"><img src="pagina-2.webp" alt="Pagina della celebrazione del Battesimo"></div><div class="overlay-card"><div class="map-meta"><div class="pin"><svg viewBox="0 0 24 24"><path d="M12 2.5c-3.7 0-6.7 2.9-6.7 6.5 0 5.1 6.7 12.4 6.7 12.4S18.7 14 18.7 9c0-3.6-3-6.5-6.7-6.5Z" fill="#c37f8a"/><circle cx="12" cy="9" r="2.6" fill="#fff"/></svg></div><div><div class="map-label">Posizione</div><div class="map-title">Parrocchia Gesù Redentore</div><div class="map-sub">Sant’Antonio Abate</div></div></div><a class="map-btn" href="https://maps.app.goo.gl/4Z26YoyzbJPuBVn4A?g_st=ic" target="_blank" rel="noopener">Apri Maps</a></div></article><article class="slide has-map" data-index="2"><div class="artframe"><img src="pagina-3.webp" alt="Pagina del ricevimento a Villa Palmentiello"></div><div class="overlay-card"><div class="map-meta"><div class="pin"><svg viewBox="0 0 24 24"><path d="M12 2.5c-3.7 0-6.7 2.9-6.7 6.5 0 5.1 6.7 12.4 6.7 12.4S18.7 14 18.7 9c0-3.6-3-6.5-6.7-6.5Z" fill="#c37f8a"/><circle cx="12" cy="9" r="2.6" fill="#fff"/></svg></div><div><div class="map-label">Ricevimento</div><div class="map-title">Villa Palmentiello</div><div class="map-sub">Casola di Napoli</div></div></div><a class="map-btn" href="https://maps.app.goo.gl/sZAAL1ZX2st9a4f99?g_st=ic" target="_blank" rel="noopener">Apri Maps</a></div></article></section><div class="hint" id="hint">Scorri per continuare</div><div class="page-ui"><button class="nav-btn" id="prev" aria-label="Pagina precedente">‹</button><div class="dots"><span class="dot active"></span><span class="dot"></span><span class="dot"></span></div><button class="nav-btn" id="next" aria-label="Pagina successiva">›</button></div><div class="door-stage" id="doors"><div class="door left"></div><div class="door right"></div><div class="seal-wrap"><div class="seal"><div class="heart">♡</div><div class="mini">Il Battesimo di</div><div class="name">Ginevra</div><div class="mini">17 Ottobre</div></div></div></div><button class="open-btn" id="openBtn" type="button">Tocca per aprire l’invito</button></main></div><script>(()=>{const invite=document.getElementById('invite'),slides=[...document.querySelectorAll('.slide')],dots=[...document.querySelectorAll('.dot')],prev=document.getElementById('prev'),next=document.getElementById('next'),hint=document.getElementById('hint'),doors=document.getElementById('doors'),openBtn=document.getElementById('openBtn'),ambient=document.getElementById('ambient');let index=0,opened=false,startX=0,startY=0;for(let i=0;i<22;i++){const s=document.createElement('i');s.className='spark';s.style.left=(3+Math.random()*94)+'%';s.style.top=(3+Math.random()*94)+'%';s.style.animationDelay=(-Math.random()*3)+'s';ambient.appendChild(s)}function petals(c=7){for(let i=0;i<c;i++){const p=document.createElement('i');p.className='petal';p.style.left=Math.random()*100+'%';p.style.setProperty('--x',Math.random()*150-75+'px');p.style.setProperty('--r',Math.random()*560-280+'deg');p.style.animationDuration=4.8+Math.random()*2.3+'s';ambient.appendChild(p);setTimeout(()=>p.remove(),7600)}}function render(){slides.forEach((s,i)=>{s.classList.remove('active','prev');if(i===index)s.classList.add('active');else if(i<index)s.classList.add('prev')});dots.forEach((d,i)=>d.classList.toggle('active',i===index));prev.disabled=index===0;next.disabled=index===slides.length-1;invite.dataset.page=index}function go(t){t=Math.max(0,Math.min(slides.length-1,t));if(t===index)return;index=t;render();petals(index===2?9:5)}function openInvite(){if(opened)return;opened=true;doors.classList.add('open');openBtn.classList.add('hide');petals(12);hint.classList.add('show');setTimeout(()=>hint.classList.remove('show'),2400);setTimeout(()=>doors.classList.add('hidden'),900)}openBtn.addEventListener('click',openInvite);doors.addEventListener('click',openInvite);prev.addEventListener('click',()=>go(index-1));next.addEventListener('click',()=>go(index+1));document.addEventListener('touchstart',e=>{startX=e.changedTouches[0].clientX;startY=e.changedTouches[0].clientY},{passive:true});document.addEventListener('touchend',e=>{if(!opened)return;const dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.15)go(index+(dx<0?1:-1))},{passive:true});render()})();</script></body></html>
